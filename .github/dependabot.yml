---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  # the base images are ARG-driven, which Dependabot's docker ecosystem cannot
  # follow; bump-caddy.yml moves them instead
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

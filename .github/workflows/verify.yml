name: verify changes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify the changes
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: lint the shell scripts
        run: shellcheck .githooks/commit-msg

      - name: lint and test the Python tools
        working-directory: tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --requirement requirements-dev.txt
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/pytest

  build:
    name: build the image and smoke-test it
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      - name: run the BuildKit Dockerfile checks
        run: docker buildx bake --check

      - name: build the amd64 image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          targets: default
          load: true
          push: false
          set: |
            *.platform=linux/amd64
            *.tags=caddy-porkbun:verify

      - name: smoke-test the image
        run: |
          set -euo pipefail
          image=caddy-porkbun:verify

          # xcaddy builds whatever CADDY_VERSION the builder image carries, so the
          # binary must match the version the tags and labels claim
          args=$(docker buildx bake --print image | jq -c '.target.image.args')
          expected=$(jq -r '.CADDY_IMAGE' <<<"$args" | sed -E 's/^caddy:([0-9.]+)-alpine@.*$/\1/')
          actual=$(docker run --rm "$image" caddy version | cut -d' ' -f1)
          echo "caddy version: ${actual} (expected v${expected})"
          [ "$actual" = "v${expected}" ]

          # the plugin must be compiled in at the pinned version
          porkbun=$(jq -r '.CADDY_PORKBUN_VERSION' <<<"$args")
          docker run --rm "$image" caddy list-modules | grep -qx dns.providers.porkbun
          docker run --rm "$image" caddy build-info | awk -v version="$porkbun" '
            $1 == "dep" && $2 == "github.com/caddy-dns/porkbun" { print; found = ($3 == version) }
            END { exit !found }'

  # the single required status check for branch protection
  verified:
    name: all checks passed
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: always()

    permissions: {}

    steps:
      - name: fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for result in ${RESULTS}; do
            [ "${result}" = "success" ] || exit 1
          done

name: build and publish caddy-porkbun image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Only inputs of the image; workflow-only or actions-bump commits must not republish it.
    paths:
      - Dockerfile
      - docker-bake.hcl
      - .dockerignore
      - .github/workflows/publish.yml
  schedule:
    # Weekly rebuild so alpine security fixes ship between digest bumps.
    - cron: '23 4 * * 3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: docker.io

jobs:
  publish:
    name: build and publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: login to docker hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: read the caddy version from the Dockerfile
        id: caddy
        run: |
          set -euo pipefail
          version=$(grep -oP '^FROM caddy:\K[0-9]+\.[0-9]+\.[0-9]+(?=\S*@sha256:)' Dockerfile)
          echo "version=${version}" | tee -a "$GITHUB_OUTPUT"

      - name: set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      - name: build and push
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          CADDY_VERSION: ${{ steps.caddy.outputs.version }}
        with:
          targets: default
          push: true
          set: |
            *.attest=type=provenance,mode=max
            *.attest=type=sbom

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign published image(s) (keyless)
        run: |
          set -euo pipefail

          cat > bake-metadata.json <<'JSON'
          ${{ steps.bake.outputs.metadata }}
          JSON

          # Extract tag@digest refs from Bake metadata and sign them.
          jq -r '
            to_entries[]
            | .value as $v
            | ($v["containerimage.digest"] // empty) as $digest
            | ($v["image.name"] // empty) as $names
            | if ($digest == "" or $names == "") then empty else
                (if ($names|type) == "string" then ($names|split(",")) else $names end)
                | map(gsub("^\\s+|\\s+$"; ""))
                | map(select(length>0))
                | .[]
                | "\(. )@\($digest)"
              end
          ' bake-metadata.json | sort -u | while read -r ref; do
            echo "Signing ${ref}"
            cosign sign --yes "${ref}"
          done
